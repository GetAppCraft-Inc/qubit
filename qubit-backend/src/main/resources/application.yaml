spring:
  application:
    name: qubit
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Load lazy/eager collections (e.g. question options) in batches instead of one query per row.
        default_batch_fetch_size: 100
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  health:
    mail:
      # Mail is optional in dev (links are logged); don't let it mark the service DOWN.
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

qubit:
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12
  mail:
    from: ${MAIL_FROM:Qubit <no-reply@qubit.app>}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-origins: ${FRONTEND_URL:http://localhost:4200}
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
  proctoring:
    disconnect-grace-seconds: 45
  media:
    storage: ${MEDIA_STORAGE:local}
    local-dir: ${MEDIA_LOCAL_DIR:./media-storage}
    work-dir: ${MEDIA_WORK_DIR:./media-work}
    public-base: ${MEDIA_PUBLIC_BASE:}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
    master-key: ${MEDIA_MASTER_KEY}
    url-secret: ${MEDIA_URL_SECRET}
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
    encoder: ${VIDEO_ENCODER:auto}
    worker-enabled: ${MEDIA_WORKER_ENABLED:true}
    max-concurrent-streams: ${MEDIA_MAX_STREAMS:2}
